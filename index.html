<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Learning Land!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sun: #FFC93C;
    --sky: #4EA8DE;
    --coral: #FF6B6B;
    --leaf: #3DDC97;
    --cream: #FFFCF4;
    --plum: #2E2145;
    --plum-soft: #5B4B7A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    color: var(--plum);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 6vw;
    position: relative;
    z-index: 2;
  }

  /* Floating background shapes */
  .blob {
    position: absolute;
    border-radius: 50%;
    z-index: 1;
    filter: blur(0px);
  }
  .blob1 { width: 220px; height: 220px; background: var(--sky); opacity: .18; top: -60px; left: -60px; animation: float 7s ease-in-out infinite; }
  .blob2 { width: 300px; height: 300px; background: var(--sun); opacity: .22; bottom: -100px; right: -80px; animation: float 9s ease-in-out infinite reverse; }
  .blob3 { width: 140px; height: 140px; background: var(--coral); opacity: .18; bottom: 8%; left: 6%; animation: float 6s ease-in-out infinite; }
  .blob4 { width: 100px; height: 100px; background: var(--leaf); opacity: .2; top: 12%; right: 10%; animation: float 8s ease-in-out infinite reverse; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-24px) translateX(10px); }
  }

  /* Mascot */
  .mascot-wrap {
    position: relative;
    margin-bottom: 1.5rem;
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(-3deg); }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 2px solid var(--sun);
    color: var(--plum-soft);
    font-weight: 800;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    margin-bottom: 1.6rem;
    box-shadow: 0 4px 0 rgba(255, 201, 60, 0.4);
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    line-height: 1.05;
    color: var(--plum);
    max-width: 16ch;
    margin-bottom: 1.1rem;
  }

  h1 .highlight {
    color: var(--coral);
    position: relative;
    display: inline-block;
  }

  h1 .highlight svg {
    position: absolute;
    left: 0;
    bottom: -8px;
    width: 100%;
    height: 14px;
  }

  .lede {
    font-size: clamp(1.05rem, 2.4vw, 1.35rem);
    font-weight: 600;
    color: var(--plum-soft);
    max-width: 42ch;
    margin-bottom: 2.4rem;
  }

  .cta-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-primary {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: white;
    background: var(--coral);
    border: none;
    padding: 1rem 2.2rem;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 0 #d94f4f;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #d94f4f; }
  .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #d94f4f; }
  .btn-primary:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }

  .btn-secondary {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--plum);
    background: white;
    border: 2px solid #EFE6D8;
    padding: 1rem 2.2rem;
    border-radius: 999px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .btn-secondary:hover { border-color: var(--sky); transform: translateY(-2px); }
  .btn-secondary:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }

  .stars {
    position: absolute;
    font-size: 1.5rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .blob, .mascot-wrap { animation: none; }
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="blob blob4"></div>

<main class="stage">

  <div class="mascot-wrap">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="#4EA8DE"/>
      <circle cx="60" cy="60" r="52" fill="#FFC93C" fill-opacity="0.15"/>
      <circle cx="42" cy="55" r="7" fill="#2E2145"/>
      <circle cx="78" cy="55" r="7" fill="#2E2145"/>
      <circle cx="44" cy="53" r="2.4" fill="white"/>
      <circle cx="80" cy="53" r="2.4" fill="white"/>
      <path d="M42 75C48 84 72 84 78 75" stroke="#2E2145" stroke-width="5" stroke-linecap="round"/>
      <path d="M28 34C24 22 34 12 46 16" stroke="#2E2145" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M92 34C96 22 86 12 74 16" stroke="#2E2145" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
  </div>

  <p class="eyebrow">🎒 New here? Perfect.</p>

  <h1>Welcome to<br><span class="highlight">Learning Land!
    <svg viewBox="0 0 200 14" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 10 Q 50 2, 100 8 T 198 6" stroke="#FFC93C" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>
  </span></h1>

  <p class="lede">Every big adventure starts with a first step — and yours starts right here. Games, stories, and puzzles are waiting for you!</p>

  <div class="cta-row">
    <button class="btn-primary">Start Exploring 🚀</button>
    <button class="btn-secondary">I'm a Parent</button>
  </div>

</main>

</body>
</html>
